events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/s;

    server {
        listen 80;

        location / {
            set $upstream app:8080;
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://$upstream;
        }
    }

    # Internal metrics server for nginx-prometheus-exporter.
    # Exposed on port 8080 inside the observability network only — not mapped to host.
    server {
        listen 8080;

        location /stub_status {
            stub_status;
            # Docker bridge networks — both 172.x.x.x and 192.168.x.x are used
            # depending on platform and compose project. Allow both.
            allow 172.0.0.0/8;
            allow 192.168.0.0/16;
            deny all;
        }

        # Block all other paths on the metrics port
        location / {
            return 404;
        }
    }
}
