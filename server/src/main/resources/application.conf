ktor {
    application {
        modules = [ com.sashaflake.ApplicationKt.module ]
    }
    deployment {
        port = 8080
    }
}

postgres {
    url = "jdbc:postgresql://localhost/default"
    user = "username"
    password = "password"
}

jwt {
    secret = "change-me-in-production"
    issuer = "engineer-challenge"
    audience = "engineer-challenge-users"
    expirationMs = 86400000
}
cors {
    allowedHosts = "http://localhost:3000"
    allowedHosts = ${?CORS_ALLOWED_HOSTS}
}
