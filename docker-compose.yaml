services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: engineer-challenge-app
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      JWT_SECRET: "change-me-in-production"
      JWT_ISSUER: "engineer-challenge"
      JWT_AUDIENCE: "engineer-challenge-users"
      STORAGE_BACKEND: "dragonfly"
      DRAGONFLY_HOST: "dragonfly"
      DRAGONFLY_PORT: "6379"
    depends_on:
      dragonfly:
        condition: service_healthy
    networks:
      - observability
    healthcheck:
      test: ["CMD-SHELL", "wget http://localhost:8080/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s


  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: engineer-challenge-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - app
      - cadvisor
    networks:
      - observability

  grafana:
    image: grafana/grafana:11.1.4
    container_name: engineer-challenge-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - observability

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: engineer-challenge-cadvisor
    restart: unless-stopped
    ports:
      - "8081:8080"
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - observability

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: engineer-challenge-dragonfly
    restart: unless-stopped
    command: dragonfly --logtostderr
    ports:
      - "6379:6379"
    ulimits:
      memlock: -1
    networks:
      - observability
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "localhost", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - observability

volumes:
  prometheus_data:
  grafana_data:

networks:
  observability:
    driver: bridge
