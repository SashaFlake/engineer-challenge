# Шаблон kubeconfig для подключения GitHub Actions к k3s.
#
# Как получить реальный файл:
#   sudo cat /etc/rancher/k3s/k3s.yaml
#
# Заменить:
#   server: https://127.0.0.1:6443  →  server: https://<PUBLIC_IP>:6443
#
# Вставить всё содержимое в GitHub Secret KUBECONFIG_PROD.
# Не коммитить реальные значения!

apiVersion: v1
kind: Config
clusters:
  - name: default
    cluster:
      server: https://<PUBLIC_IP>:6443
      certificate-authority-data: <base64-encoded-ca-cert>
contexts:
  - name: default
    context:
      cluster: default
      user: default
current-context: default
users:
  - name: default
    user:
      client-certificate-data: <base64-encoded-client-cert>
      client-key-data: <base64-encoded-client-key>
