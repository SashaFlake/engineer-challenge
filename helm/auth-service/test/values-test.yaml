replicaCount: 1

image:
  repository: auth-service
  tag: latest
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: false

ingress:
  enabled: false

env:
  JWT_ISSUER: "auth-service-test"
  JWT_AUDIENCE: "auth-service-users-test"
  CORS_ALLOWED_HOSTS: "http://localhost:3000,https://app.test.example.com"

secrets:
  JWT_SECRET: "test-secret-not-for-production"
