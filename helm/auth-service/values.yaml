replicaCount: 1

image:
  repository: auth-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: auth.local
      paths:
        - path: /graphql
          pathType: Prefix
        - path: /graphiql
          pathType: Prefix
        - path: /metrics
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# /health endpoint does not exist in this service — use /metrics (Micrometer/Prometheus)
livenessProbe:
  httpGet:
    path: /metrics
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /metrics
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 5
  failureThreshold: 3

env:
  JWT_ISSUER: "auth-service"
  JWT_AUDIENCE: "auth-service-users"
  CORS_ALLOWED_HOSTS: "http://localhost:3000"
  # Default to in-memory storage for local/test environments.
  # Override with STORAGE_BACKEND=dragonfly in prod.
  STORAGE_BACKEND: "memory"
  DRAGONFLY_HOST: "dragonfly"
  DRAGONFLY_PORT: "6379"

secrets:
  # JWT secret — override via --set secrets.JWT_SECRET=... or values-prod.yaml
  JWT_SECRET: ""

serviceAccount:
  create: false
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/metrics"
  prometheus.io/port: "8080"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

# Dragonfly subchart (aliased from Bitnami Redis — Redis-protocol compatible).
# enabled: true  — deploy Dragonfly alongside the service (default for local/test K8s)
# enabled: false — use a managed Redis-compatible service, set DRAGONFLY_HOST via env
dragonfly:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: false
  replica:
    replicaCount: 0
