replicaCount: 1

image:
  repository: auth-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: auth.local
      paths:
        - path: /graphql
          pathType: Prefix
        - path: /graphiql
          pathType: Prefix
        - path: /metrics
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# startupProbe даёт JVM до 3 минуты на старт, не мешая liveness/readiness
startupProbe:
  httpGet:
    path: /metrics
    port: 8080
  failureThreshold: 36
  periodSeconds: 5

# /health endpoint does not exist — use /metrics (Micrometer/Prometheus)
livenessProbe:
  httpGet:
    path: /metrics
    port: 8080
  initialDelaySeconds: 0
  periodSeconds: 15
  failureThreshold: 4

readinessProbe:
  httpGet:
    path: /metrics
    port: 8080
  initialDelaySeconds: 0
  periodSeconds: 10
  failureThreshold: 6

env:
  JWT_ISSUER: "auth-service"
  JWT_AUDIENCE: "auth-service-users"
  CORS_ALLOWED_HOSTS: "http://localhost:3000"
  # Default to in-memory for local/test. Override with dragonfly in prod.
  STORAGE_BACKEND: "memory"
  DRAGONFLY_HOST: "dragonfly"
  DRAGONFLY_PORT: "6379"

secrets:
  JWT_SECRET: ""

serviceAccount:
  create: false
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/metrics"
  prometheus.io/port: "8080"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

# ServiceMonitor для Prometheus Operator
serviceMonitor:
  enabled: false

# Dragonfly subchart отключён — деплоится отдельно
dragonfly:
  enabled: false
