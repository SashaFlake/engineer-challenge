# Деплой без домена — прямой доступ по IP через NodePort.
# TLS и ingress отключены.
# Адрес кластера и CORS передаются через GitHub Secrets, не хранятся в git.
#
# Dragonfly деплоится отдельно через helm/dragonfly/.
# dragonfly.enabled=false отключает subchart и снимает зависимость от redis chart.
replicaCount: 1

image:
  repository: ghcr.io/sashaflake/auth-service
  # tag переопределяется из CI через --set image.tag=<version>
  tag: "latest"
  pullPolicy: Always

# Секрет для пулла из GHCR (private package)
# Создаётся в CI перед деплоем
imagePullSecrets:
  - name: ghcr-auth

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false

ingress:
  enabled: false

service:
  type: NodePort
  port: 8080
  nodePort: 30081

serviceMonitor:
  enabled: false

env:
  JWT_ISSUER: "auth-service-prod"
  JWT_AUDIENCE: "auth-service-users"
  CORS_ALLOWED_HOSTS: ""
  STORAGE_BACKEND: "dragonfly"
  DRAGONFLY_HOST: "auth-service-dragonfly-master.auth.svc.cluster.local"
  DRAGONFLY_PORT: "6379"

secrets:
  JWT_SECRET: ""

dragonfly:
  enabled: false
