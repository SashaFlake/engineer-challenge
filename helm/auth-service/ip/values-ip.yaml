# Значения для развёртывания без домена — прямой доступ по IP через NodePort.
# TLS и cert-manager отключены, ingress отключён.
replicaCount: 1

image:
  repository: ghcr.io/sashaflake/auth-service
  tag: "latest"
  pullPolicy: Always

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false

ingress:
  enabled: false

service:
  type: NodePort
  port: 8080
  nodePort: 30081

serviceMonitor:
  enabled: true

env:
  JWT_ISSUER: "auth-service-prod"
  JWT_AUDIENCE: "auth-service-users"
  CORS_ALLOWED_HOSTS: "http://213.171.30.170:30080"
  STORAGE_BACKEND: "dragonfly"
  DRAGONFLY_HOST: "auth-service-dragonfly-master.auth.svc.cluster.local"
  DRAGONFLY_PORT: "6379"

dragonfly:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: false
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  replica:
    replicaCount: 0
