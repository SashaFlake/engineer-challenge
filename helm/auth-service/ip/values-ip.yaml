# Деплой без домена — прямой доступ по IP через NodePort.
# TLS и ingress отключены.
# Адрес кластера и CORS передаются через GitHub Secrets, не хранятся в git.
#
# Dragonfly деплоится отдельно через helm/dragonfly/.
# dragonfly.enabled=false отключает subchart и снимает зависимость от redis chart.
replicaCount: 1

image:
  repository: ghcr.io/sashaflake/auth-service
  # tag переопределяется из CI через --set image.tag=<version>
  tag: "latest"
  pullPolicy: Always

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false

ingress:
  enabled: false

service:
  type: NodePort
  port: 8080
  nodePort: 30081

serviceMonitor:
  enabled: false

env:
  JWT_ISSUER: "auth-service-prod"
  JWT_AUDIENCE: "auth-service-users"
  # CORS_ALLOWED_HOSTS передаётся через --set env.CORS_ALLOWED_HOSTS=${{ secrets.CORS_ALLOWED_HOSTS }}
  CORS_ALLOWED_HOSTS: ""
  STORAGE_BACKEND: "dragonfly"
  # Dragonfly задеплоен отдельно в том же namespace auth
  DRAGONFLY_HOST: "dragonfly-master.auth.svc.cluster.local"
  DRAGONFLY_PORT: "6379"

# secrets.JWT_SECRET передаётся через --set secrets.JWT_SECRET=${{ secrets.JWT_SECRET_PROD }}
secrets:
  JWT_SECRET: ""

# Subchart отключён — Dragonfly деплоится отдельно
dragonfly:
  enabled: false
