name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  lint:
    name: Lint (ktlint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run ktlint
        run: ./gradlew ktlintCheck --no-daemon

      - name: Upload ktlint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-report
          path: '**/build/reports/ktlint/'
          retention-days: 7

  test:
    name: Domain Tests + Coverage
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run domain tests
        run: ./gradlew :domain:jvmTest --no-daemon

      - name: Generate coverage report (Kover)
        run: ./gradlew :domain:koverXmlReport :domain:koverHtmlReport --no-daemon

      - name: Check coverage threshold
        run: ./gradlew :domain:koverVerify --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: domain/build/reports/tests/
          retention-days: 14

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-html
          path: domain/build/reports/kover/html/
          retention-days: 14

      - name: Upload XML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-xml
          path: domain/build/reports/kover/report.xml
          retention-days: 14

      - name: Coverage summary in PR
        if: github.event_name == 'pull_request'
        uses: mi-kas/kover-report@v1
        with:
          path: domain/build/reports/kover/report.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Domain Coverage
          update-comment: true
          min-coverage-overall: 60
          min-coverage-changed-files: 60

  build:
    name: Build fat JAR
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build fat JAR
        run: ./gradlew :server:buildFatJar --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-jar
          path: server/build/libs/*-all.jar
          retention-days: 7

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart (default values)
        run: helm lint helm/auth-service

      - name: Lint chart (test values)
        run: helm lint helm/auth-service -f helm/auth-service/test/values-test.yaml

      - name: Lint chart (prod values)
        run: |
          helm lint helm/auth-service \
            -f helm/auth-service/prod/values-prod.yaml \
            --set secrets.JWT_SECRET=dummy-for-lint

      - name: Helm template dry-run
        run: |
          helm template auth-service helm/auth-service \
            -f helm/auth-service/test/values-test.yaml \
            --debug > /dev/null
