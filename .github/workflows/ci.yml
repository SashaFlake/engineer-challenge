name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build fat JAR
        run: ./gradlew :server:buildFatJar --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/tests/'
          retention-days: 7

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart (default values)
        run: helm lint helm/auth-service

      - name: Lint chart (test values)
        run: helm lint helm/auth-service -f helm/auth-service/test/values-test.yaml

      - name: Lint chart (prod values)
        run: |
          helm lint helm/auth-service \
            -f helm/auth-service/prod/values-prod.yaml \
            --set secrets.JWT_SECRET=dummy-for-lint

      - name: Helm template dry-run
        run: |
          helm template auth-service helm/auth-service \
            -f helm/auth-service/test/values-test.yaml \
            --debug > /dev/null
