name: CD

on:
  push:
    branches: [master]
    tags:
      - 'v*'

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/auth-service
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-prod:
    name: Deploy to k3s (NodePort)
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: prod
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster connection
        run: kubectl get nodes

      - name: Create GHCR pull secret
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          kubectl create namespace auth --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-auth \
            --docker-server=ghcr.io \
            --docker-username="${REPO_OWNER}" \
            --docker-password="${GHCR_TOKEN}" \
            --namespace auth \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy auth-service
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET_PROD }}
          CORS_HOSTS: ${{ secrets.CORS_ALLOWED_HOSTS }}
          # metadata-action генерирует тег без 'v': v1.0.6 -> 1.0.6
          # Убираем 'v' из github.ref_name через bash substring
          IMAGE_TAG: ${{ github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          IMAGE_REPO="ghcr.io/${REPO_OWNER,,}/auth-service"
          # Убираем префикс 'v': v1.0.6 -> 1.0.6
          IMAGE_TAG_CLEAN="${IMAGE_TAG#v}"
          helm upgrade --install auth-service ./helm/auth-service \
            -f helm/auth-service/ip/values-ip.yaml \
            --set "image.repository=${IMAGE_REPO}" \
            --set "image.tag=${IMAGE_TAG_CLEAN}" \
            --set "secrets.JWT_SECRET=${JWT_SECRET}" \
            --set "env.CORS_ALLOWED_HOSTS=${CORS_HOSTS}" \
            --namespace auth \
            --create-namespace \
            --wait \
            --timeout 10m
